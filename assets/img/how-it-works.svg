<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" aria-label="แผนภาพเส้นทางการเรียนรู้ของเว็บโค้ดน้อย" font-family="'Sukhumvit Set','Thonburi','Noto Sans Thai',system-ui,sans-serif" role="img" viewBox="0 0 1600 900"><defs><linearGradient id="knDiagBg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#FFF8EC"/><stop offset="1" stop-color="#FFF1DC"/></linearGradient></defs><rect width="1594" height="894" x="3" y="3" fill="url(#knDiagBg)" stroke="#F0E4D0" stroke-width="6" rx="34"/><text x="80" y="92" fill="#2B2A4C" font-size="44" font-weight="bold">โค้ดน้อย — เส้นทางการเรียนรู้ของนักเขียนโปรแกรมตัวจิ๋ว</text><text x="80" y="138" fill="#5B5A7E" font-size="23">เว็บเล่น–เรียนโค้ดดิ้งสำหรับเด็ก 5 ขวบ · ทุกห้องเล่นด้วยการแตะ ไม่ต้องอ่านออกก็เล่นได้</text><g fill="#2B2A4C" font-size="19" font-weight="bold" text-anchor="middle"><rect width="249" height="86" x="80" y="180" fill="#FFF" stroke="#F0E4D0" stroke-width="4" rx="22"/><rect width="249" height="86" x="377" y="180" fill="#FFF" stroke="#F0E4D0" stroke-width="4" rx="22"/><rect width="249" height="86" x="674" y="180" fill="#FFF" stroke="#F0E4D0" stroke-width="4" rx="22"/><rect width="249" height="86" x="971" y="180" fill="#FFF" stroke="#F0E4D0" stroke-width="4" rx="22"/><rect width="249" height="86" x="1268" y="180" fill="#FFF" stroke="#F0E4D0" stroke-width="4" rx="22"/><text x="204" y="233">หน้าแรก</text><text x="502" y="233">ล็อบบี้ 11 ห้องเล่น</text><text x="798" y="233">ดาวรางวัล + สติกเกอร์</text><text x="1095" y="233">กิจกรรมไม่ใช้จอ</text><text x="1392" y="233">สำหรับผู้ปกครอง</text><polygon fill="#E0B71B" points="341 212 365 223 341 234"/><polygon fill="#E0B71B" points="638 212 662 223 638 234"/><polygon fill="#E0B71B" points="935 212 959 223 935 234"/><polygon fill="#E0B71B" points="1232 212 1256 223 1232 234"/></g><text x="80" y="318" fill="#5B5A7E" font-size="24" font-weight="bold">11 ห้องเรียนรู้ — ห้องเดิม 5 ห้อง + ห้องใหม่ 6 ห้อง</text><g><rect width="256" height="300" x="80" y="340" fill="#FFF" stroke="#F0E4D0" stroke-width="5" rx="28"/><rect width="220" height="12" x="98" y="358" fill="#FF6B6B" rx="6"/><circle cx="136" cy="416" r="32" fill="#FF6B6B"/><text x="136" y="429" fill="#FFF" font-size="34" font-weight="bold" text-anchor="middle">1</text><text x="104" y="492" fill="#2B2A4C" font-size="22" font-weight="bold">หุ่นยนต์เก็บดาว</text><text x="104" y="524" fill="#E14C4C" font-size="16" font-weight="bold">ลำดับคำสั่ง · 8 ด่าน</text><text x="104" y="570" fill="#5B5A7E" font-size="16">กดลูกศรสั่งหุ่นยนต์</text><text x="104" y="600" fill="#5B5A7E" font-size="16">ฝึกวางแผนเป็นขั้นเป็นตอน</text></g><g><rect width="256" height="300" x="376" y="340" fill="#FFF" stroke="#F0E4D0" stroke-width="5" rx="28"/><rect width="220" height="12" x="394" y="358" fill="#9B7BFF" rx="6"/><circle cx="432" cy="416" r="32" fill="#9B7BFF"/><text x="432" y="429" fill="#FFF" font-size="34" font-weight="bold" text-anchor="middle">2</text><text x="400" y="492" fill="#2B2A4C" font-size="22" font-weight="bold">อะไรต่อนะ</text><text x="400" y="524" fill="#7C5BE0" font-size="16" font-weight="bold">การเห็นรูปแบบ · 14 ข้อ</text><text x="400" y="570" fill="#5B5A7E" font-size="16">ทายว่าอะไรมาต่อ</text><text x="400" y="600" fill="#5B5A7E" font-size="16">ฟังจังหวะช่วยจำได้</text></g><g><rect width="256" height="300" x="672" y="340" fill="#FFF" stroke="#F0E4D0" stroke-width="5" rx="28"/><rect width="220" height="12" x="690" y="358" fill="#5BC97E" rx="6"/><circle cx="728" cy="416" r="32" fill="#5BC97E"/><text x="728" y="429" fill="#FFF" font-size="34" font-weight="bold" text-anchor="middle">3</text><text x="696" y="492" fill="#2B2A4C" font-size="22" font-weight="bold">แยกตะกร้า</text><text x="696" y="524" fill="#3FA45F" font-size="16" font-weight="bold">การจำแนก · ถ้า–แล้ว</text><text x="696" y="570" fill="#5B5A7E" font-size="16">แยกตามสีและชนิด</text><text x="696" y="600" fill="#5B5A7E" font-size="16">ฝึกดูคุณสมบัติของของ</text></g><g><rect width="256" height="300" x="968" y="340" fill="#FFF" stroke="#F0E4D0" stroke-width="5" rx="28"/><rect width="220" height="12" x="986" y="358" fill="#7BC6FF" rx="6"/><circle cx="1024" cy="416" r="32" fill="#7BC6FF"/><text x="1024" y="429" fill="#FFF" font-size="34" font-weight="bold" text-anchor="middle">4</text><text x="992" y="492" fill="#2B2A4C" font-size="22" font-weight="bold">ห้องแสงสี</text><text x="992" y="524" fill="#4FA3E3" font-size="16" font-weight="bold">สร้างสรรค์ · จังหวะและลูป</text><text x="992" y="570" fill="#5B5A7E" font-size="16">แตะช่องให้สีและเสียง</text><text x="992" y="600" fill="#5B5A7E" font-size="16">เล่นย้อนกลับเป็นเพลง</text></g><g><rect width="256" height="300" x="1264" y="340" fill="#FFF" stroke="#F0E4D0" stroke-width="5" rx="28"/><rect width="220" height="12" x="1282" y="358" fill="#FF8A5B" rx="6"/><circle cx="1320" cy="416" r="32" fill="#FF8A5B"/><text x="1320" y="429" fill="#FFF" font-size="34" font-weight="bold" text-anchor="middle">5</text><text x="1288" y="492" fill="#2B2A4C" font-size="22" font-weight="bold">เรียงเรื่องราว</text><text x="1288" y="524" fill="#D96F35" font-size="16" font-weight="bold">ลำดับเหตุการณ์ · 6 ชุด</text><text x="1288" y="570" fill="#5B5A7E" font-size="16">เรียงการ์ดให้เป็นเรื่อง</text><text x="1288" y="600" fill="#5B5A7E" font-size="16">อะไรเกิดก่อน–หลัง</text></g><polygon fill="#E0B71B" points="344 470 368 490 344 510"/><polygon fill="#E0B71B" points="640 470 664 490 640 510"/><polygon fill="#E0B71B" points="936 470 960 490 936 510"/><polygon fill="#E0B71B" points="1232 470 1256 490 1232 510"/><g fill="#2B2A4C" font-size="18" text-anchor="middle"><text x="800" y="656" fill="#5B5A7E" font-size="19" font-weight="bold" text-anchor="middle">ห้องใหม่อีก 6 ห้อง: 🎈 จับคู่ลูกโป่ง (ความจำ) · 🎵 บันไดดนตรี (ฟังเสียง–ลำดับ) · 🍎 ตลาดนับของ (การนับ)</text><text x="800" y="670" fill="#5B5A7E" font-size="19" font-weight="bold" text-anchor="middle">🔵 ตามรอยรูปร่าง (รูปร่าง–สมาธิ) · 🌀 เขาวงกตเสียง (นำทาง) · 🔤 อารมณ์ตัวอักษร (สังเกต)</text></g><rect width="1440" height="220" x="80" y="670" fill="#FFF" stroke="#F0E4D0" stroke-width="5" rx="32"/><text x="112" y="712" fill="#2B2A4C" font-size="22" font-weight="bold">ทักษะที่เกิดขึ้น</text><text x="112" y="812" fill="#2B2A4C" font-size="22" font-weight="bold">หลักการออกแบบ</text><g fill="#2B2A4C" font-size="17" text-anchor="middle"><rect width="214" height="44" x="112" y="728" fill="#E7F9EC" stroke="#5BC97E" stroke-width="3" rx="22"/><text x="219" y="757">ลำดับคำสั่ง</text><rect width="214" height="44" x="344" y="728" fill="#E7F9EC" stroke="#5BC97E" stroke-width="3" rx="22"/><text x="451" y="757">การเห็นรูปแบบ</text><rect width="214" height="44" x="576" y="728" fill="#E7F9EC" stroke="#5BC97E" stroke-width="3" rx="22"/><text x="683" y="757">การจำแนกและเงื่อนไข</text><rect width="214" height="44" x="808" y="728" fill="#E7F9EC" stroke="#5BC97E" stroke-width="3" rx="22"/><text x="915" y="757">ลำดับเหตุการณ์</text><rect width="214" height="44" x="1040" y="728" fill="#E7F9EC" stroke="#5BC97E" stroke-width="3" rx="22"/><text x="1147" y="757">แก้ปัญหาทีละขั้น</text><rect width="214" height="44" x="1272" y="728" fill="#E7F9EC" stroke="#5BC97E" stroke-width="3" rx="22"/><text x="1379" y="757">ความคิดสร้างสรรค์</text><rect width="214" height="44" x="112" y="828" fill="#FFF1D6" stroke="#E0B71B" stroke-width="3" rx="22"/><text x="219" y="857">ไม่มีสถานะแพ้</text><rect width="214" height="44" x="344" y="828" fill="#FFF1D6" stroke="#E0B71B" stroke-width="3" rx="22"/><text x="451" y="857">ปุ่มใหญ่กดง่าย</text><rect width="214" height="44" x="576" y="828" fill="#FFF1D6" stroke="#E0B71B" stroke-width="3" rx="22"/><text x="683" y="857">ภาพ–เสียงก่อนอ่าน</text><rect width="214" height="44" x="808" y="828" fill="#FFF1D6" stroke="#E0B71B" stroke-width="3" rx="22"/><text x="915" y="857">รอบละ 3–5 นาที</text><rect width="214" height="44" x="1040" y="828" fill="#FFF1D6" stroke="#E0B71B" stroke-width="3" rx="22"/><text x="1147" y="857">ผู้ปกครองเล่นด้วยได้</text><rect width="214" height="44" x="1272" y="828" fill="#FFF1D6" stroke="#E0B71B" stroke-width="3" rx="22"/><text x="1379" y="857">ไม่มีโฆษณา</text></g></svg>