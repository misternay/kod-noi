<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     font-family="'Sukhumvit Set','Thonburi','Noto Sans Thai',system-ui,sans-serif"
     role="img" aria-label="แผนภาพเส้นทางการเรียนรู้ของเว็บโค้ดน้อย">
  <defs>
    <linearGradient id="knDiagBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8EC"/>
      <stop offset="1" stop-color="#FFF1DC"/>
    </linearGradient>
  </defs>

  <rect x="3" y="3" width="1594" height="894" rx="34" fill="url(#knDiagBg)" stroke="#F0E4D0" stroke-width="6"/>

  <!-- หัวเรื่อง -->
  <text x="80" y="92" font-size="44" font-weight="bold" fill="#2B2A4C">โค้ดน้อย — เส้นทางการเรียนรู้ของนักเขียนโปรแกรมตัวจิ๋ว</text>
  <text x="80" y="138" font-size="23" fill="#5B5A7E">เว็บเล่น–เรียนโค้ดดิ้งสำหรับเด็ก 5 ขวบ · ทุกสถานีเล่นด้วยการแตะ ไม่ต้องอ่านออกก็เล่นได้</text>

  <!-- แถวโครงสร้างเว็บ: 5 หน้า -->
  <g font-size="19" font-weight="bold" fill="#2B2A4C" text-anchor="middle">
    <rect x="80" y="180" width="249" height="86" rx="22" fill="#FFFFFF" stroke="#F0E4D0" stroke-width="4"/>
    <rect x="377" y="180" width="249" height="86" rx="22" fill="#FFFFFF" stroke="#F0E4D0" stroke-width="4"/>
    <rect x="674" y="180" width="249" height="86" rx="22" fill="#FFFFFF" stroke="#F0E4D0" stroke-width="4"/>
    <rect x="971" y="180" width="249" height="86" rx="22" fill="#FFFFFF" stroke="#F0E4D0" stroke-width="4"/>
    <rect x="1268" y="180" width="249" height="86" rx="22" fill="#FFFFFF" stroke="#F0E4D0" stroke-width="4"/>

    <text x="204" y="233">หน้าแรก</text>
    <text x="502" y="233">ล็อบบี้ 11 ห้องเล่น</text>
    <text x="798" y="233">ดาวรางวัล + สติกเกอร์</text>
    <text x="1095" y="233">กิจกรรมไม่ใช้จอ</text>
    <text x="1392" y="233">สำหรับผู้ปกครอง</text>

    <polygon points="341,212 365,223 341,234" fill="#E0B71B"/>
    <polygon points="638,212 662,223 638,234" fill="#E0B71B"/>
    <polygon points="935,212 959,223 935,234" fill="#E0B71B"/>
    <polygon points="1232,212 1256,223 1232,234" fill="#E0B71B"/>
  </g>

  <!-- หัวข้อแถวสถานี -->
  <text x="80" y="318" font-size="24" font-weight="bold" fill="#5B5A7E">11 ห้องเรียนรู้ — ห้องเดิม 5 ห้อง + ห้องใหม่ 6 ห้อง</text>

  <!-- การ์ดสถานี 1 -->
  <g>
    <rect x="80" y="340" width="256" height="300" rx="28" fill="#FFFFFF" stroke="#F0E4D0" stroke-width="5"/>
    <rect x="98" y="358" width="220" height="12" rx="6" fill="#FF6B6B"/>
    <circle cx="136" cy="416" r="32" fill="#FF6B6B"/>
    <text x="136" y="429" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="104" y="492" font-size="22" font-weight="bold" fill="#2B2A4C">หุ่นยนต์เก็บดาว</text>
    <text x="104" y="524" font-size="16" font-weight="bold" fill="#E14C4C">ลำดับคำสั่ง · 8 ด่าน</text>
    <text x="104" y="570" font-size="16" fill="#5B5A7E">กดลูกศรสั่งหุ่นยนต์</text>
    <text x="104" y="600" font-size="16" fill="#5B5A7E">ฝึกวางแผนเป็นขั้นเป็นตอน</text>
  </g>

  <!-- การ์ดสถานี 2 -->
  <g>
    <rect x="376" y="340" width="256" height="300" rx="28" fill="#FFFFFF" stroke="#F0E4D0" stroke-width="5"/>
    <rect x="394" y="358" width="220" height="12" rx="6" fill="#9B7BFF"/>
    <circle cx="432" cy="416" r="32" fill="#9B7BFF"/>
    <text x="432" y="429" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="400" y="492" font-size="22" font-weight="bold" fill="#2B2A4C">อะไรต่อนะ</text>
    <text x="400" y="524" font-size="16" font-weight="bold" fill="#7C5BE0">การเห็นรูปแบบ · 14 ข้อ</text>
    <text x="400" y="570" font-size="16" fill="#5B5A7E">ทายว่าอะไรมาต่อ</text>
    <text x="400" y="600" font-size="16" fill="#5B5A7E">ฟังจังหวะช่วยจำได้</text>
  </g>

  <!-- การ์ดสถานี 3 -->
  <g>
    <rect x="672" y="340" width="256" height="300" rx="28" fill="#FFFFFF" stroke="#F0E4D0" stroke-width="5"/>
    <rect x="690" y="358" width="220" height="12" rx="6" fill="#5BC97E"/>
    <circle cx="728" cy="416" r="32" fill="#5BC97E"/>
    <text x="728" y="429" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="696" y="492" font-size="22" font-weight="bold" fill="#2B2A4C">แยกตะกร้า</text>
    <text x="696" y="524" font-size="16" font-weight="bold" fill="#3FA45F">การจำแนก · ถ้า–แล้ว</text>
    <text x="696" y="570" font-size="16" fill="#5B5A7E">แยกตามสีและชนิด</text>
    <text x="696" y="600" font-size="16" fill="#5B5A7E">ฝึกดูคุณสมบัติของของ</text>
  </g>

  <!-- การ์ดสถานี 4 -->
  <g>
    <rect x="968" y="340" width="256" height="300" rx="28" fill="#FFFFFF" stroke="#F0E4D0" stroke-width="5"/>
    <rect x="986" y="358" width="220" height="12" rx="6" fill="#7BC6FF"/>
    <circle cx="1024" cy="416" r="32" fill="#7BC6FF"/>
    <text x="1024" y="429" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="992" y="492" font-size="22" font-weight="bold" fill="#2B2A4C">ห้องแสงสี</text>
    <text x="992" y="524" font-size="16" font-weight="bold" fill="#4FA3E3">สร้างสรรค์ · จังหวะและลูป</text>
    <text x="992" y="570" font-size="16" fill="#5B5A7E">แตะช่องให้สีและเสียง</text>
    <text x="992" y="600" font-size="16" fill="#5B5A7E">เล่นย้อนกลับเป็นเพลง</text>
  </g>

  <!-- การ์ดสถานี 5 -->
  <g>
    <rect x="1264" y="340" width="256" height="300" rx="28" fill="#FFFFFF" stroke="#F0E4D0" stroke-width="5"/>
    <rect x="1282" y="358" width="220" height="12" rx="6" fill="#FF8A5B"/>
    <circle cx="1320" cy="416" r="32" fill="#FF8A5B"/>
    <text x="1320" y="429" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="1288" y="492" font-size="22" font-weight="bold" fill="#2B2A4C">เรียงเรื่องราว</text>
    <text x="1288" y="524" font-size="16" font-weight="bold" fill="#D96F35">ลำดับเหตุการณ์ · 6 ชุด</text>
    <text x="1288" y="570" font-size="16" fill="#5B5A7E">เรียงการ์ดให้เป็นเรื่อง</text>
    <text x="1288" y="600" font-size="16" fill="#5B5A7E">อะไรเกิดก่อน–หลัง</text>
  </g>

  <polygon points="344,470 368,490 344,510" fill="#E0B71B"/>
  <polygon points="640,470 664,490 640,510" fill="#E0B71B"/>
  <polygon points="936,470 960,490 936,510" fill="#E0B71B"/>
  <polygon points="1232,470 1256,490 1232,510" fill="#E0B71B"/>

  <!-- แถบชื่อห้องเพิ่มเติม -->
  <g font-size="18" fill="#2B2A4C" text-anchor="middle">
    <text x="800" y="656" font-weight="bold" fill="#5B5A7E" font-size="19" text-anchor="middle">ห้องใหม่อีก 6 ห้อง: 🎈 จับคู่ลูกโป่ง (ความจำ) · 🎵 บันไดดนตรี (ฟังเสียง–ลำดับ) · 🍎 ตลาดนับของ (การนับ)</text>
    <text x="800" y="670" font-weight="bold" fill="#5B5A7E" font-size="19" text-anchor="middle">🔵 ตามรอยรูปร่าง (รูปร่าง–สมาธิ) · 🌀 เขาวงกตเสียง (นำทาง) · 🔤 อารมณ์ตัวอักษร (สังเกต)</text>
  </g>

  <!-- แถบล่าง -->
  <rect x="80" y="670" width="1440" height="220" rx="32" fill="#FFFFFF" stroke="#F0E4D0" stroke-width="5"/>
  <text x="112" y="712" font-size="22" font-weight="bold" fill="#2B2A4C">ทักษะที่เกิดขึ้น</text>
  <text x="112" y="812" font-size="22" font-weight="bold" fill="#2B2A4C">หลักการออกแบบ</text>

  <g font-size="17" fill="#2B2A4C" text-anchor="middle">
    <rect x="112" y="728" width="214" height="44" rx="22" fill="#E7F9EC" stroke="#5BC97E" stroke-width="3"/>
    <text x="219" y="757">ลำดับคำสั่ง</text>
    <rect x="344" y="728" width="214" height="44" rx="22" fill="#E7F9EC" stroke="#5BC97E" stroke-width="3"/>
    <text x="451" y="757">การเห็นรูปแบบ</text>
    <rect x="576" y="728" width="214" height="44" rx="22" fill="#E7F9EC" stroke="#5BC97E" stroke-width="3"/>
    <text x="683" y="757">การจำแนกและเงื่อนไข</text>
    <rect x="808" y="728" width="214" height="44" rx="22" fill="#E7F9EC" stroke="#5BC97E" stroke-width="3"/>
    <text x="915" y="757">ลำดับเหตุการณ์</text>
    <rect x="1040" y="728" width="214" height="44" rx="22" fill="#E7F9EC" stroke="#5BC97E" stroke-width="3"/>
    <text x="1147" y="757">แก้ปัญหาทีละขั้น</text>
    <rect x="1272" y="728" width="214" height="44" rx="22" fill="#E7F9EC" stroke="#5BC97E" stroke-width="3"/>
    <text x="1379" y="757">ความคิดสร้างสรรค์</text>

    <rect x="112" y="828" width="214" height="44" rx="22" fill="#FFF1D6" stroke="#E0B71B" stroke-width="3"/>
    <text x="219" y="857">ไม่มีสถานะแพ้</text>
    <rect x="344" y="828" width="214" height="44" rx="22" fill="#FFF1D6" stroke="#E0B71B" stroke-width="3"/>
    <text x="451" y="857">ปุ่มใหญ่กดง่าย</text>
    <rect x="576" y="828" width="214" height="44" rx="22" fill="#FFF1D6" stroke="#E0B71B" stroke-width="3"/>
    <text x="683" y="857">ภาพ–เสียงก่อนอ่าน</text>
    <rect x="808" y="828" width="214" height="44" rx="22" fill="#FFF1D6" stroke="#E0B71B" stroke-width="3"/>
    <text x="915" y="857">รอบละ 3–5 นาที</text>
    <rect x="1040" y="828" width="214" height="44" rx="22" fill="#FFF1D6" stroke="#E0B71B" stroke-width="3"/>
    <text x="1147" y="857">ผู้ปกครองเล่นด้วยได้</text>
    <rect x="1272" y="828" width="214" height="44" rx="22" fill="#FFF1D6" stroke="#E0B71B" stroke-width="3"/>
    <text x="1379" y="857">ไม่มีโฆษณา</text>
  </g>
</svg>
